version: 0.2

env:
  variables:
    GOCACHE: "/root/.cache/go-build"

phases:
  install:
    runtime-versions:
      golang: 1.27
    commands:
      - "go version"
      - "pwd"
      - "ls -la"

  pre_build:
    commands:
      - "pwd && ls -la"
      - |
        MOD_DIR=$(dirname $(find . -name "go.mod" | head -n 1))
        echo "Found go.mod in: $MOD_DIR"
        cd "$MOD_DIR"
        go mod download
        go mod verify

  build:
    commands:
      - |
        MOD_DIR=$(dirname $(find . -name "go.mod" | head -n 1))
        cd "$MOD_DIR"
        mkdir -p bin
        echo "Compiling microservices from $(pwd)..."
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o application ./gateway
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/gateway ./gateway
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/order ./order
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/product ./product

artifacts:
  files:
    - "**/application"
    - "**/Procfile"
    - "**/bin/*"
